name: build-and-deploy-qa

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test API
        run: dotnet test api/MrMetis.sln

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
          - name: api
            context: ./api
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase owner for image names
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/mrmetis-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/mrmetis-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: [self-hosted, homeserver]
    environment:
      name: qa
      url: https://mrmetis-qa.romkats.eu
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy
        env:
          TAG: ${{ github.sha }}
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          APP_DIR=/srv/apps/mrmetis-qa
          mkdir -p "$APP_DIR"
          cp deploy/compose.yml "$APP_DIR/compose.yml"
          umask 077
          # TAG pins the exact build; the secrets come from the qa environment
          printf '%s\n' \
            "TAG=$TAG" \
            "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD" \
            "DB_APP_PASSWORD=$DB_APP_PASSWORD" \
            "JWT_SECRET=$JWT_SECRET" > "$APP_DIR/.env"
          cd "$APP_DIR"
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Smoke test
        run: |
          # the first start waits for SQL Server and runs migrations, so allow up to 3 minutes
          for i in $(seq 1 36); do
            if curl -fsS -H 'Host: mrmetis-qa.romkats.eu' http://127.0.0.1:8080/health; then
              echo
              curl -fsS -o /dev/null -H 'Host: mrmetis-qa.romkats.eu' http://127.0.0.1:8080/
              exit 0
            fi
            sleep 5
          done
          docker compose -f /srv/apps/mrmetis-qa/compose.yml logs --tail 50 api
          exit 1

      - name: Clean up old images
        if: always()
        run: docker image prune -af --filter "until=168h"
