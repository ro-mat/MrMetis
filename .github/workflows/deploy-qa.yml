name: build-and-deploy-qa

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test API
        run: dotnet test api/MrMetis.sln

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
          - name: api
            context: ./api
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase owner for image names
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/mrmetis-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/mrmetis-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The home server's deploy receiver (ro-mat/homeserver-infra, deployer/) only accepts this
  # job's OIDC token: repo, environment `qa` and branch main must match its apps.json, and it
  # deploys exactly the commit this job ran on. compose.yml and .env live on the server.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://mrmetis-qa.romkats.eu
    permissions:
      id-token: write
    steps:
      - name: Deploy to home server
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$DEPLOY_URL" | jq -r .value)
          echo "::add-mask::$token"
          # the output streams while compose runs; the last line says whether it worked
          curl -fsSN "$DEPLOY_URL/deploy" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            -d '{"app":"mrmetis-qa"}' | tee deploy.log
          tail -n 1 deploy.log | grep -q '^DEPLOY OK'

      - name: Smoke test
        run: |
          # the first start waits for SQL Server and runs migrations, so allow up to 3 minutes
          for i in $(seq 1 36); do
            if curl -fsS https://mrmetis-qa.romkats.eu/health; then
              echo
              curl -fsS -o /dev/null https://mrmetis-qa.romkats.eu/
              exit 0
            fi
            sleep 5
          done
          exit 1
