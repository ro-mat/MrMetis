# the same image runs on QA and prod; only prod should show up in search results
map $host $robots_tag {
  default "noindex, nofollow";
  mrmetis.eu "";
  www.mrmetis.eu "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # hashed file names, safe to cache forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag $robots_tag;
  }

  # client-side routing: unknown paths get index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag $robots_tag;
  }
}
