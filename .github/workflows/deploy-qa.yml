name: build-and-deploy-qa

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test API
        run: dotnet test api/MrMetis.sln

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
          - name: api
            context: ./api
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase owner for image names
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/mrmetis-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/mrmetis-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The home server runner belongs to the private ro-mat/MrMetis-deploy repo, so pull
  # requests here can never reach it. This only asks that repo to deploy the build;
  # the deploy itself (and your approval) shows up in its Actions tab.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Trigger deploy in MrMetis-deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: gh workflow run deploy-qa.yml -R ro-mat/MrMetis-deploy -f sha="$GITHUB_SHA"
