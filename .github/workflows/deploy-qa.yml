name: build-and-deploy-qa

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-qa
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test API
        run: dotnet test api/MrMetis.sln

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
          - name: api
            context: ./api
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase owner for image names
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER }}/mrmetis-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/mrmetis-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: ${{ vars.APP_URL }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/home-deploy
        with:
          app: mrmetis-qa
          url: ${{ vars.APP_URL }}
          deploy-url: ${{ vars.DEPLOY_URL }}
