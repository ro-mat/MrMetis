name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api:
    name: api build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build api/MrMetis.sln

      - name: Test
        run: dotnet test api/MrMetis.sln --no-build

  web:
    name: web build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run

  docker:
    name: docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
          - name: api
            context: ./api
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # build only, to catch Dockerfile breakage before it reaches main
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
