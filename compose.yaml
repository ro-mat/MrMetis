# Local development database. Start with `docker compose up -d` or `podman compose up -d`.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-MrMetis(!)Local1}
    ports:
      - "1433:1433"
    volumes:
      # MSSQL_DATA can point at a host directory when the default volume location
      # doesn't support O_DIRECT (e.g. an ecryptfs-encrypted home), see README
      - ${MSSQL_DATA:-mrmetis-sql}:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mrmetis-sql:
